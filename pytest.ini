; Anchors pytest's rootdir to the repository root and limits a bare `pytest` to the API
; suite.
;
; The root `conftest.py` must load before anything under `lechoes/` is collected: it installs
; stand-ins for the serving dependencies missing from the analysis env, without which
; `lechoes/test_api.py` fails at import on `ModuleNotFoundError: No module named
; 'SPARQLWrapper'` — an error about the environment, not about the tests.
;
; `testpaths` names the API suite because it is the only pytest suite at this level, and
; because collecting the whole tree would also pick up `lechoes/src/test_linker.py`, which
; makes live Wikidata calls. The others are run from their own directories:
; `lechoes/src/test_triplifier.py` takes an explicit path, and the evaluation packs anchor
; their own rootdir (`lechoes/eval/metadata-extraction/pytest.ini`).
[pytest]
testpaths = lechoes/test_api.py
addopts = -q
