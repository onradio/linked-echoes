        item_description: "Queen - 'Red Special' guitar played by Brian May and coil cable"
        caption: |
          6 Queen ‘John Birch’ electric guitar and amp played by Brian May The first and probably most talked-about replica of Brian’s home made guitar, affectionately known as the Red Special, is simply called ‘the John Birch’. It was the main live backup to the Red Special during the late 1970s/early 1980s and famously appeared in Queen’s We Will Rock You and Spread Your Wings video shoots in 1977, before meeting an ignominious end at a show in New Jersey in 1982. “I wasn’t somebody who habitually smashed up his guitar or set alight to it, but there was one night, where I had broken a string and I had picked up a spare, which was the John Birch replica of my guitar, a pale brown-coloured Red Special, and the thing just didn’t cooperate – it wouldn’t play properly – I couldn’t get any sound out of it. It didn’t seem to be close to in tune and it sounded like a wet blanket to me; so in total frustration I lobbed it up in the air and had no idea where it would land.” Brian May In 2004, the guitar was rediscovered in bits and shipped back to Brian and repaired by Andrew Guyton Brian May would play the guitar with a Vox AC30 amplifier distorting at full power. This, combined with his unusual choice of a sixpence as a plectrum, helped to create his legendary guitar sound. By kind permission of Brian May
