field_nudges:
  enabled: false
  hints:
    - "`music_artists`: Include all named performers, bands, or creators."
    - "`music_works`: List specific compositions, songs, or featured works."
    - "`years`: Extract years from any date mentioned in the text."
    - "`events`: Capture concert names, festivals, or commemorative occasions."
    - "`venues`: Identify locations where music events took place or were recorded."
    - "`countries`, `places`: Extract from geographic cues in description or caption."
    - "`cardinality`: Use 0 if no quantity or count is mentioned."
