# ----------------------
# Gemini Model Settings
# ----------------------
gemini:
  mode: balanced         # Options: strict | balanced | creative
  model_name: gemini-2.0-flash
  temperature: null      # Overrides preset if set
  top_p: null
  max_output_tokens: null

# ----------------------
# Prompt Configuration
# ----------------------
prompt_variant: base_prompt
prompt_mode: few-shot
output_mode: tool_call

role_block:
  enabled: true
  variant: contextual_historian  # switch this to try other role personas

  variants:
    strict_archivist:
      persona: meticulous museum archivist
      specialization: music history
      task: extract structured metadata from item description and caption
      tone: strict
      allow_creativity: false
      output_format: tool_call

    creative_archivist:
      persona: meticulous museum archivist
      specialization: music history
      task: extract structured metadata from item description and caption
      tone: strict
      allow_creativity: true
      output_format: tool_call

    soft_curator:
      persona: friendly exhibition curator
      specialization: British pop and rock artifacts
      task: gently enrich item details using exhibition context
      tone: supportive
      allow_creativity: true
      output_format: tool_call

    exploratory_ai_researcher:
      persona: AI researcher studying museum metadata extraction
      specialization: multimodal knowledge extraction
      task: benchmark model output against schema constraints
      tone: neutral
      allow_creativity: true
      output_format: tool_call

    contextual_historian:
      persona: cultural historian with deep context of British music and fashion
      specialization: narrative artifact contextualization
      task: identify and relate metadata using context clues from the item's era and genre
      tone: reflective
      allow_creativity: moderately_limited
      output_format: tool_call

    exhibit_storyteller:
      persona: exhibition narrator bringing artifacts to life
      specialization: engaging storytelling with factual grounding
      task: enrich metadata with inferred or stylistic elements while remaining faithful
      tone: expressive
      allow_creativity: high
      output_format: tool_call

    data_validation_bot:
      persona: strict metadata validator bot
      specialization: Pydantic-style validation of schema fields
      task: only return values that match exactly with known metadata fields
      tone: dry
      allow_creativity: false
      output_format: tool_call

    schema_filler_ai:
      persona: metadata autofill assistant
      specialization: maximizing schema population from minimal cues
      task: ensure as many fields as possible are populated, using context-based inference
      tone: efficient
      allow_creativity: true
      output_format: tool_call

    ner_aware_annotator:
      persona: expert metadata annotator with a background in named entity recognition
      specialization: museum collection indexing and cultural heritage tagging
      task: identify and extract metadata fields as named entities based on the schema
      tone: analytical
      allow_creativity: false
      output_format: tool_call

instruction_block:
  enabled: true
  variant: strict_schema_extraction

  variants:
    strict_schema_extraction:
      emphasis: every field must be extracted
      fallback: default values must be used when information is missing
      inference: only allowed for `music_genres`, never for any other field
      phrasing: |
        You MUST populate all fields from the schema. 
        If data is missing, use "", [], or 0 according to the schema specification.
        Only infer genres, and ONLY if artists or instruments suggest a clear genre.

    relaxed_extraction:
      emphasis: focus on key fields only
      fallback: skip non-essential fields if data is missing
      inference: allowed for genre, title, and materials
      phrasing: |
        You should extract as many fields as possible, prioritizing `item_title`, `base_type`, and `music_artists`.
        Use your best judgment for genre or material inference, but do not hallucinate details.

    explanation_friendly:
      emphasis: explain extraction rules to the model
      fallback: always mention defaults for transparency
      inference: allowed when context is strong
      phrasing: |
        For each field, explain your reasoning briefly.
        If a field cannot be populated confidently, assign its default value and state why.

    ner_hint_with_schema:
      emphasis: extract every schema field using entity cues
      fallback: apply schema defaults where data is missing
      inference: only allowed for `music_genres` and `materials` when cues exist
      phrasing: |
        You MUST extract and populate all fields from the schema.

        You MUST populate all fields from the schema. 
        If data is missing, use "", [], or 0 according to the schema specification.
        Only infer genres, and ONLY if artists or instruments suggest a clear genre.

        Use the following named entity categories to guide extraction:
        - People and artists → `music_artists`
        - Events (concerts, festivals) → `events`, `music_works`
        - Locations (places, venues, countries) → `places`, `venues`, `countries`
        - Works (songs, albums, sheet music) → `music_albums`, `music_works`
        - Temporal cues (years, decades) → `years`
        - Materials or media → `materials`

        Avoid hallucination. Follow the schema and entity types exactly.

    ner_hint_with_schema_notes:
      phrasing: |
        You MUST populate all fields from the schema. 
        If data is missing, use "", [], or 0 according to the schema specification.
        Only infer genres, and ONLY if artists or instruments suggest a clear genre.

        Use the following named entity categories to guide extraction:
        - People and artists → `music_artists`
        - Events (concerts, festivals) → `events`, `music_works`
        - Locations (places, venues, countries) → `places`, `venues`, `countries`
        - Works (songs, albums, sheet music) → `music_albums`, `music_works`
        - Temporal cues (years, decades) → `years`
        - Materials or media → `materials`

        ## Field-Specific Notes
        - `music_artists`: Include all explicitly mentioned performers or bands.
        - `years`: May be inferred from date mentions in the caption or description.
        - `materials`: Look for words describing what the object is made of (e.g., vinyl, paper).
        - `music_genres`: Only infer genres when clearly supported.
        - `base_type` / `specific_type`: Use descriptive nouns that categorize the item.



schema_block:
  enabled: true
  include_schema_comment: true
  schema_style: python   # or json, or none

input_block:
  enabled: true
  mode: batch
  independent_mode: true

output_block:
  enabled: true
  variant: tool_call

  variants:
    tool_call:
      output_format: tool_call
      notes: Output must be a function call to `record_item_data` with all fields present.

    json:
      output_format: json
      notes: Output should be a valid JSON object matching the schema.

    plain_text:
      output_format: plain_text
      notes: Output should describe each field in human-readable text, suitable for non-technical users.



one_shot_example:
  example:
    item_description: "German promotional leaflet for Ken Colyer's Jazzmen issued by The National Jazz Federation"
    caption: "16 Ken Colyer German promotional leaflet for Ken Colyer's Jazzmen issued by The National Jazz Federation"
  example_output:
    base_type: "Written Source"
    specific_type: "Event Programme"
    item_title: "Programme for the New Orleans Joys concert"
    music_genres: [ "Jazz" ]
    music_artists:
      - "Ken Colyer"
      - "Acker Bilk"
      - "Acker Bilk And His Paramount Jazz Band"
      - "Ken Colyer's jazzmen"
    events: [ "New Orleans Joys" ]
    countries: [ ]
    places: [ ]
    venues: [ ]
    years: [ ]
    colours: [ ]
    materials: [ ]
    cardinality: 1

