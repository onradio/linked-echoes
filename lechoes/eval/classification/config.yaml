# Configuration for the classification evaluation (spec §7).
# Every stage reads its parameters from here; nothing is hard-coded in a runner.

# Object text seen by the systems: name then description, blank fields skipped.
# Captions are deliberately excluded — they are annotator context only.
object_text: [name, description]

category:
  systems: [C0, C1, C2]                 # C2-scoped is the ablation, reported in prose
  accept_secondary: true                # a prediction matching either gold is correct (§4.1)
  majority_class: Textual & Graphic Work # C0; 39/65 = 60.0% on this sample

retrieval:
  # One similarity only. all-MiniLM-L6-v2 ends in a Normalize layer, so its
  # output is already unit-norm and L2 ordering is identical to cosine ordering
  # (‖a−b‖² = 2 − 2·⟨a,b⟩); measured on the full grid, converting the recorded
  # inner products reproduces the L2 scores to 6 dp. `l2_unnormalised` is still
  # a valid build and can be reproduced with `--similarity l2_unnormalised`;
  # it is not a separate experimental condition.
  similarity: [cosine_normalised]
  index_strategies: [term, combine]
  queries: [description, name_description, hint_description]
  # Six points rather than four: retrieval costs no API calls and every k is a
  # slice of the same k_max pool, so the denser grid is free and shows the shape
  # of the curve rather than four corners of it.
  k_grid: [5, 10, 20, 30, 40, 50]
  embedding_model: all-MiniLM-L6-v2
  # Retrieval is run once at k_max and every smaller k is a slice of that pool,
  # never a re-query — the same discipline the entity-linking evaluation applies
  # to its frozen candidate pools.
  k_max: 50

selection:
  k_grid: [5, 10, 20, 50]
  prompt: single
  # Both retrieval configurations are run at every k, and both are reported.
  # Retrieval configuration is therefore a factor of the experiment rather than
  # a choice made on the evaluation set, and within each configuration k remains
  # the only variable — so the sweep stays interpretable and nothing is tuned.
  #   term_hint    the deployed pipeline: term-only indices, "<hint>: <description>"
  #   combine_name the configuration that retrieves best at large k (Experiment B)
  configurations:
    - {id: term_hint, index_strategy: term, query: hint_description}
    - {id: combine_name, index_strategy: combine, query: name_description}
  # The selection prompt is IDENTICAL across configurations, hint included, so
  # that the two differ only in retrieval. Removing the hint from the prompt in
  # the name_description condition would vary two things at once; that is a
  # prompt ablation and a separate experiment.
  hint_in_prompt: always

fallback_to_aat: true                   # fixed, see §0.4

# Models under comparison, as `provider:model`. Dated ids are pinned rather than
# `-latest` aliases, which drift and would make the reported numbers
# unreproducible. `models[0]` is the reference model: the one the pipeline
# deploys, the one single-model runs default to, and the baseline every paired
# comparison in score.py is taken against.
llm:
  temperature: 0.0
  models:
    - id: google:gemini-2.5-flash      # deployed; the reference
      label: Gemini 2.5 Flash
    - id: google:gemini-3.6-flash
      label: Gemini 3.6 Flash
    - id: mistral:mistral-large-2512   # Mistral Large 3
      label: Mistral Large 3
    - id: mistral:ministral-14b-2512   # Ministral 3 14B Instruct
      label: Ministral 14B
runs: 3
llm_cache: {enabled: true, key: [model, prompt, run_index]}

paths:
  annotations: data/classification_annotation_sheet_done.csv
  indices: data/indices
  predictions: data/predictions
  results: data/results

scoring:
  gold_includes_alternates: true         # strong rows: gold ∪ alt
  weak_gold: {alt_match: TP, abstention: TA_weak, other_term: WT}   # see §2.0 / §4.2
  abstention_accuracy_over: [weak, nil]  # n=15; nil alone is n=1
  exclude_nil_reasons: [data_error]

bootstrap: {resamples: 10000, cluster_by: case}
