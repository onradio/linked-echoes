; Anchors pytest's rootdir to this evaluation pack.
;
; Without it, pytest builds its collection tree from the repository root, `bmeapi/`
; becomes a package node, and `Package.setup()` imports `bmeapi/__init__.py` — which
; pulls in FastAPI and SPARQLWrapper, absent from the `lechoes` analysis env. The tests
; then fail with `ModuleNotFoundError: No module named 'SPARQLWrapper'` and nothing to
; do with the tests themselves. Same reason the pipeline stubs `bmeapi` out of
; `sys.modules` and the eval packs import bare.
[pytest]
testpaths = .
addopts = -q
